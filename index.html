<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSE-07 Batch Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --paper:#F4F7F0;
    --paper-2:#E9EFE3;
    --ink:#1B2430;
    --ink-soft:#586258;
    --line:#C7D2BE;
    --line-strong:#AAB89F;
    --accent:#B08A3E;
    --accent-ink:#8A6A2C;
    --credit:#3C6E47;
    --debit:#A23B33;
    --surface:#FCFBF7;
    --surface-2:#F1F4EC;
    --shadow:rgba(27,36,48,.10);
    --radius:10px;
    --focus:#2F6FED;
    --font-display:'Tiro Bangla','Noto Serif Bengali',Georgia,serif;
    --font-sans:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12160F; --paper-2:#171C14; --ink:#EAEEE4; --ink-soft:#9CA895;
      --line:#2C3427; --line-strong:#3A4432; --accent:#D8B36B; --accent-ink:#E7C989;
      --credit:#79C48D; --debit:#E4796F; --surface:#1A1F16; --surface-2:#20261B;
      --shadow:rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160F; --paper-2:#171C14; --ink:#EAEEE4; --ink-soft:#9CA895;
    --line:#2C3427; --line-strong:#3A4432; --accent:#D8B36B; --accent-ink:#E7C989;
    --credit:#79C48D; --debit:#E4796F; --surface:#1A1F16; --surface-2:#20261B;
    --shadow:rgba(0,0,0,.35);
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html,body{ margin:0; padding:0; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-sans); font-size:15px; line-height:1.5; -webkit-tap-highlight-color:transparent; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }
  a{ color:var(--accent-ink); }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }

  .skip-link{ position:absolute; left:-9999px; top:auto; background:var(--accent); color:#1B2430; padding:10px 16px; border-radius:8px; z-index:10001; font-weight:700; text-decoration:none; }
  .skip-link:focus{ left:12px; top:calc(12px + env(safe-area-inset-top,0px)); }

  /* ---------- Topbar ---------- */
  .topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper-2); border-bottom:3px double var(--line-strong); }
  .topbar-inner{ max-width:880px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:10px 14px; }
  .brand{ flex:0 0 auto; min-width:0; }
  .brand-title{ font-family:var(--font-display); font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw; }
  .brand-sub{ font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .tabs{ flex:1 1 auto; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:2px 0; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; background:transparent; border:1px solid transparent; border-radius:8px; padding:7px 12px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .tab.active{ background:var(--surface); color:var(--accent-ink); border-color:var(--line); }
  .tab-add{ font-size:16px; font-weight:700; color:var(--accent-ink); }
  .icon-btn{ flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }

  main{ max-width:880px; margin:0 auto; padding:16px 14px 48px; }
  main:focus{ outline:none; }
  .page-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .page-title{ font-family:var(--font-display); font-size:22px; font-weight:600; }
  .page-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .toolbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }

  .btn{ appearance:none; -webkit-appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#1B2430; }
  .btn-ghost{ background:transparent; }
  .btn-danger{ background:transparent; border-color:var(--debit); color:var(--debit); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; }
  .btn-block{ display:block; width:100%; text-align:center; margin-top:10px; }
  .icon-btn-sm{ width:34px; height:34px; border-radius:7px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:13px; display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn-sm.danger{ color:var(--debit); border-color:var(--debit); }
  .icon-btn-sm[disabled]{ opacity:.35; cursor:not-allowed; }
  .search-input{ flex:1 1 220px; border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; padding:9px 12px; }
  .sort-select{ border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; padding:9px 10px; font-size:12.5px; }
  .filter-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--line-strong); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:#1B2430; }

  /* ---------- List / register rows ---------- */
  .list{ display:flex; flex-direction:column; gap:8px; }
  .row{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .row-main{ display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; }
  .row-roll{ font-family:var(--font-mono); font-weight:600; font-size:12.5px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:4px 7px; min-width:26px; text-align:center; }
  .row-roll.sm{ padding:3px 6px; font-size:11.5px; }
  .row-roll.date-chip{ min-width:78px; font-size:11px; }
  .row-name{ flex:1 1 auto; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill{ font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .pill-c0{ background:rgba(60,110,71,.14); color:var(--credit); }
  .pill-c1{ background:rgba(176,138,62,.18); color:var(--accent-ink); }
  .pill-c2{ background:rgba(162,59,51,.14); color:var(--debit); }
  .pill-c3{ background:rgba(47,111,237,.14); color:#2F6FED; }
  .pill-c4{ background:rgba(124,77,180,.14); color:#7C4DB4; }
  .pill-c5{ background:rgba(24,140,140,.14); color:#188C8C; }
  .due-flag{ font-size:10.5px; font-weight:700; color:var(--debit); background:rgba(162,59,51,.12); padding:3px 7px; border-radius:999px; white-space:nowrap; }
  .streak-badge{ font-size:11px; font-weight:700; color:#B45309; background:rgba(180,83,9,.12); padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .complete-badge{ font-size:11px; color:var(--credit); font-weight:700; margin-left:6px; }
  .onboard-banner{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; font-size:13px; }
  .due-list{ display:flex; flex-direction:column; gap:8px; }
  .due-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:9px 12px; }
  .due-row-name{ flex:1 1 auto; font-weight:600; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .due-row-amount{ font-family:var(--font-mono); font-weight:600; color:var(--debit); white-space:nowrap; }
  .chevron{ font-size:16px; color:var(--ink-soft); transition:transform .15s ease; display:inline-block; }
  .chevron.open{ transform:rotate(180deg); }
  .row-detail{ padding:4px 14px 14px; border-top:1px dashed var(--line); }
  .field-line{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; font-size:13px; border-bottom:1px dotted var(--line); }
  .field-line:last-of-type{ border-bottom:none; }
  .field-label{ color:var(--ink-soft); }
  .field-value{ text-align:right; font-weight:500; }
  .muted{ color:var(--ink-soft); font-style:italic; }
  .muted-inline{ color:var(--ink-soft); font-size:11.5px; font-weight:500; }
  .row-actions{ display:flex; gap:8px; margin-top:10px; }
  .empty-state{ text-align:center; padding:28px 16px; color:var(--ink-soft); border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--surface-2); }

  /* ---------- Fund summary ---------- */
  .cards-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; }
  .stat-card-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; }
  .stat-card-value{ font-family:var(--font-mono); font-weight:600; font-size:16px; }
  .stat-card.credit .stat-card-value{ color:var(--credit); }
  .stat-card.debit .stat-card-value{ color:var(--debit); }
  @media (max-width:520px){ .cards-grid{ grid-template-columns:1fr; } }

  .trend-strip{ display:flex; align-items:flex-end; gap:8px; height:96px; padding:10px 4px 4px; margin-bottom:20px; border-bottom:1px dashed var(--line); }
  .trend-bar-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:1 1 0; }
  .trend-bar{ width:100%; max-width:22px; background:var(--credit); border-radius:3px 3px 0 0; min-height:4px; }
  .trend-bar-label{ font-size:10px; color:var(--ink-soft); }

  .section-block{ margin-bottom:26px; }
  .section-block-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .section-block-title{ font-family:var(--font-display); font-size:17px; font-weight:600; }

  .month-list{ display:flex; flex-direction:column; gap:8px; }
  .month-row{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .month-row-header{ display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; }
  .month-name{ flex:1 1 auto; font-weight:600; }
  .month-stats{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); }
  .month-progress{ height:4px; background:var(--surface-2); }
  .month-progress-bar{ height:100%; background:var(--credit); }
  .month-detail{ padding:10px 12px 14px; border-top:1px dashed var(--line); }
  .month-detail-toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .form-label-sm{ font-size:12px; color:var(--ink-soft); }
  .form-input-sm{ width:80px; border:1px solid var(--line-strong); background:var(--surface); border-radius:6px; padding:5px 7px; font-family:var(--font-mono); }
  .pay-row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dotted var(--line); }
  .pay-row:last-child{ border-bottom:none; }
  .pay-name{ flex:1 1 auto; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pay-amount{ width:70px; border:1px solid var(--line-strong); background:var(--surface); border-radius:6px; padding:5px 6px; font-family:var(--font-mono); font-size:12.5px; }
  .switch{ position:relative; display:inline-block; width:38px; height:22px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{ position:absolute; inset:0; background:var(--line-strong); border-radius:999px; cursor:pointer; transition:.15s; }
  .switch .slider::before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider{ background:var(--credit); }
  .switch input:checked + .slider::before{ transform:translateX(16px); }
  .switch input:focus-visible + .slider{ outline:2px solid var(--focus); outline-offset:2px; }

  .expense-list{ display:flex; flex-direction:column; gap:8px; }
  .expense-amount{ font-family:var(--font-mono); font-weight:600; color:var(--debit); white-space:nowrap; }

  /* ---------- Modal ---------- */
  #modalRoot{ position:fixed; inset:0; z-index:9999; display:none; }
  #modalRoot.open{ display:block; }
  .modal-backdrop{ position:absolute; inset:0; background:rgba(20,24,18,.45); display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .modal-backdrop{ align-items:center; padding:24px; } }
  .modal{ background:var(--paper); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; box-shadow:0 -6px 30px var(--shadow); padding-bottom:env(safe-area-inset-bottom,0px); }
  .modal:focus{ outline:none; }
  @media (min-width:640px){ .modal{ border-radius:14px; } }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; position:sticky; top:0; background:var(--paper); }
  .modal-title{ font-family:var(--font-display); font-size:18px; font-weight:600; }
  .modal-close{ border:none; background:var(--surface-2); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; }
  .modal-body{ padding:6px 18px 4px; }
  .modal-footer{ display:flex; justify-content:flex-end; gap:10px; padding:14px 18px 18px; }

  .form-group{ margin-bottom:12px; }
  .form-row{ display:flex; gap:10px; }
  .form-row .form-group{ flex:1 1 0; }
  .flex2{ flex:2 1 0; }
  .form-label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:600; }
  .form-input,.form-select,textarea.form-input{ width:100%; border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; padding:9px 10px; }
  .form-hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .checkbox-group .form-check{ display:flex; align-items:center; gap:8px; font-weight:500; }

  /* ---------- Settings ---------- */
  .settings-tabs{ display:flex; gap:4px; overflow-x:auto; padding:0 18px 8px; border-bottom:1px solid var(--line); }
  .stab{ flex:0 0 auto; border:none; background:transparent; padding:8px 10px; font-weight:600; font-size:12.5px; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .stab.active{ color:var(--accent-ink); border-bottom-color:var(--accent); }
  .settings-body{ padding-top:12px; }
  .settings-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dotted var(--line); }
  .settings-nav-input{ flex:1 1 auto; border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:7px 9px; }
  .settings-row-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .settings-field-info{ flex:1 1 auto; font-size:13.5px; }
  .badge-core{ font-size:10.5px; font-weight:700; color:var(--ink-soft); border:1px solid var(--line); padding:2px 7px; border-radius:999px; }
  .inline-field-add{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .inline-field-add input{ flex:1 1 120px; }
  .inline-field-add select{ flex:0 0 110px; }
  .danger-zone{ margin-top:20px; border:1px dashed var(--debit); border-radius:10px; padding:12px; }
  .danger-zone-title{ font-weight:700; color:var(--debit); font-size:13px; margin-bottom:8px; }
  .builder-field-row{ display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .builder-field-row input{ flex:1 1 auto; border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:7px 9px; }
  .builder-field-row select{ flex:0 0 108px; border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:7px 6px; }
  .format-choice{ display:flex; gap:8px; flex-wrap:wrap; }
  .format-btn.active{ background:var(--accent); border-color:var(--accent); color:#1B2430; }

  /* ---------- Options editor (drag & drop) ---------- */
  .options-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .option-item{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .drag-handle{ cursor:grab; color:var(--ink-soft); font-size:16px; padding:0 2px; touch-action:none; }
  .option-input{ flex:1 1 auto; border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:7px 9px; min-width:0; }
  .sortable-ghost{ opacity:.4; }
  .sortable-chosen{ background:var(--surface); }

  /* ---------- Toast ---------- */
  #toastContainer{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:10000; max-width:92vw; display:flex; align-items:center; gap:10px; justify-content:center; }
  #toastContainer.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .toast-undo{ background:transparent; border:1px solid var(--paper); color:var(--paper); border-radius:6px; padding:4px 10px; font-weight:700; font-size:12px; cursor:pointer; flex:0 0 auto; }

  /* ---------- Export sheet (rendered off-screen for PDF/PNG) ---------- */
  .export-sheet{ background:#FCFBF7; color:#1B2430; font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif; padding:28px; }
  .export-head{ border-bottom:3px double #AAB89F; padding-bottom:10px; margin-bottom:16px; }
  .export-title{ font-size:20px; font-weight:700; }
  .export-sub{ font-size:12px; color:#586258; margin-top:2px; }
  .export-sheet h3{ font-size:15px; margin:18px 0 8px; }
  .export-sheet h4{ font-size:13px; margin:14px 0 6px; color:#586258; }
  .export-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .export-table th,.export-table td{ border:1px solid #C7D2BE; padding:6px 8px; text-align:left; }
  .export-table th{ background:#E9EFE3; }
</style>
</head>

    /* ================= Helpers ================= */
    function escapeHTML(s){
      return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];

      return ({text:'টেক্সট', number:'সংখ্যা', date:'তারিখ', link:'লিংক', checkbox:'চেকবক্স', select:'ড্রপডাউন'})[ty] || ty;

      var base = String(label).toLowerCase().replace(/[^a-z0-9\u0980-\u09FF]+/g,'_').replace(/^_+|_+$/g,'').slice(0,20);
      return 'f_' + (base||'field') + '_' + Math.random().toString(36).slice(2,5);

    }
    function showUndoToast(msg, restoreFn){

    }
    function showCelebration(label){ toast('🎉 '+label+' মাসের পুরো ফান্ড সংগ্রহ সম্পন্ন হয়েছে!'); }

    /* ================= Data operations ================= */
    function getPayment(m, studentId){ return m.payments[studentId] || {paid:false, amount:m.amount}; }
    function studentDue(studentId){
      var due=0;
      state.fund.months.forEach(function(m){ var p=getPayment(m,studentId); if(!p.paid) due += Number(p.amount||0); });
      return due;
    }
    function studentStreak(studentId){
      var months = state.fund.months.slice().sort(function(a,b){ return b.key.localeCompare(a.key); });
      var streak = 0;
      for(var i=0;i<months.length;i++){
        var p = getPayment(months[i], studentId);
        if(p.paid) streak++; else break;
      }
      return streak;
    }
    function nextMonthKey(){
      var keys = state.fund.months.map(function(m){ return m.key; }).sort();
      var base;
      if(keys.length){
        var last = keys[keys.length-1];
        var p = last.split('-'); var y=Number(p[0]), mo=Number(p[1]);
        base = new Date(y, mo, 1);
      } else { base = new Date(); }
      var y2=base.getFullYear(), m2=String(base.getMonth()+1).padStart(2,'0');
      return y2+'-'+m2;
    }
    function addMonth(){
      var key = nextMonthKey();
      if(state.fund.months.some(function(m){ return m.key===key; })){ toast('এই মাস আগে থেকেই আছে'); return; }
      var amount = state.fund.monthlyAmount;
      var payments = {};
      state.students.forEach(function(s){ payments[s.id] = {paid:false, amount:amount}; });
      state.fund.months.push({key:key, amount:amount, payments:payments});
      state.fund.months.sort(function(a,b){ return a.key.localeCompare(b.key); });
      expandedMonth = key;
      render();
    }
    function deleteMonth(key){
      state.fund.months = state.fund.months.filter(function(m){ return m.key!==key; });
      if(expandedMonth===key) expandedMonth=null;
      render();
    }
    function setMonthAmount(key, val){
      var m = state.fund.months.find(function(x){ return x.key===key; }); if(!m) return;
      m.amount = Number(val||0);
    }
    function setPaymentAmount(key, studentId, val){
      var m = state.fund.months.find(function(x){ return x.key===key; }); if(!m) return;
      if(!m.payments[studentId]) m.payments[studentId] = {paid:false, amount:0};
      m.payments[studentId].amount = Number(val||0);
    }
    function togglePayment(key, studentId, checked){
      var m = state.fund.months.find(function(x){ return x.key===key; }); if(!m) return;
      var expected = monthExpected(m);
      var beforeFull = expected>0 && monthCollected(m) >= expected;
      if(!m.payments[studentId]) m.payments[studentId] = {paid:false, amount:m.amount};
      m.payments[studentId].paid = !!checked;
      var afterFull = expected>0 && monthCollected(m) >= expected;
      if(checked && !beforeFull && afterFull) showCelebration(monthLabel(m.key));
    }
    function markAllPaid(key){
      var m = state.fund.months.find(function(x){ return x.key===key; }); if(!m) return;
      state.students.forEach(function(s){
        if(!m.payments[s.id]) m.payments[s.id] = {paid:false, amount:m.amount};
        m.payments[s.id].paid = true;
      });
      if(monthExpected(m)>0) showCelebration(monthLabel(m.key));
      render();
    }
    function totalCollected(){
      return state.fund.months.reduce(function(sum,m){
        return sum + Object.keys(m.payments).reduce(function(s,k){ var p=m.payments[k]; return s + (p.paid?Number(p.amount||0):0); }, 0);
      }, 0);
    }
    function totalExpense(){ return state.fund.expenses.reduce(function(s,e){ return s+Number(e.amount||0); }, 0); }
    function balanceAmt(){ return totalCollected() - totalExpense(); }
    function monthCollected(m){ return Object.keys(m.payments).reduce(function(s,k){ var p=m.payments[k]; return s+(p.paid?Number(p.amount||0):0); }, 0); }
    function monthExpected(m){ return state.students.length * Number(m.amount||0); }

    function addExpense(data){

    function addStudent(data){
      var id = uid();
      var fields = {};
      state.studentSchema.forEach(function(f){ fields[f.key] = (data[f.key]!==undefined && data[f.key]!==null) ? data[f.key] : (f.type==='checkbox'?false:''); });
      var student = { id:id, roll:data.roll, name:data.name, fields:fields };
      state.students.push(student);
      state.students.sort(function(a,b){ return (Number(a.roll)-Number(b.roll)) || String(a.name).localeCompare(String(b.name)); });
      state.fund.months.forEach(function(m){ m.payments[id] = {paid:false, amount:m.amount}; });
      render();
    }
    function updateStudent(id, data){
      var s = state.students.find(function(x){ return x.id===id; }); if(!s) return;
      s.roll = data.roll; s.name = data.name;
      state.studentSchema.forEach(function(f){ if(data[f.key]!==undefined) s.fields[f.key]=data[f.key]; });
      state.students.sort(function(a,b){ return (Number(a.roll)-Number(b.roll)) || String(a.name).localeCompare(String(b.name)); });
      render();

    function deleteStudentSoft(id){

      if(idx<0) return;
      var snapshot = state.students[idx];
      var paymentSnapshots = {};
      state.fund.months.forEach(function(m){ if(m.payments[id]) paymentSnapshots[m.key]=m.payments[id]; });
      state.students.splice(idx,1);
      state.fund.months.forEach(function(m){ delete m.payments[id]; });
      render();
      showUndoToast('শিক্ষার্থী মুছে ফেলা হয়েছে', function(){
        state.students.splice(Math.min(idx, state.students.length),0,snapshot);

    function renderTrendStrip(){
      var months = state.fund.months.slice().sort(function(a,b){ return a.key.localeCompare(b.key); }).slice(-6);
      if(!months.length) return '';
      var maxVal = 1;
      months.forEach(function(m){ maxVal = Math.max(maxVal, monthCollected(m), monthExpected(m)); });
      var bars = months.map(function(m){
        var h = Math.max(4, Math.round(monthCollected(m)/maxVal*70));

    /* ================= Modal system ================= */
    function trapFocusHandler(e){
      if(e.key!=='Tab') return;
      var root = document.getElementById('modalRoot');
      var focusables = root.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
      if(!focusables.length) return;
      var list = Array.prototype.slice.call(focusables);
      var first = list[0], last = list[list.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
    function openModal(html){
      lastFocusedBeforeModal = document.activeElement;
      var root = document.getElementById('modalRoot');
      root.innerHTML = '<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal" data-action="modal-stop" role="dialog" aria-modal="true" aria-labelledby="modalTitleId" tabindex="-1">'+html+'</div></div>';
      root.classList.add('open');
      var form = root.querySelector('form');
      if(form){ form.addEventListener('submit', function(e){ e.preventDefault(); if(form._onSubmit) form._onSubmit(new FormData(form)); }); }
      var modalEl = root.querySelector('.modal');
      modalEl.addEventListener('keydown', trapFocusHandler);
      setTimeout(function(){ modalEl.focus(); }, 10);
    }
    function closeModal(){
      var root = document.getElementById('modalRoot');
      root.classList.remove('open');
      root.innerHTML='';
      if(lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus==='function'){
        try{ lastFocusedBeforeModal.focus(); }catch(e){}
      }
      lastFocusedBeforeModal = null;
    }

        return '<div class="form-group"><label class="form-label" for="'+inputId+'">'+escapeHTML(f.label)+'</label><select class="form-select" id="'+inputId+'" name="'+f.key+'">'+opts+'</select></div>';
      }
      if(f.type==='checkbox'){
        return '<div class="form-group checkbox-group"><label class="form-check"><input type="checkbox" id="'+inputId+'" name="'+f.key+'" '+(value?'checked':'')+'> '+escapeHTML(f.label)+'</label></div>';

      var inputType = f.type==='number' ? 'number' : (f.type==='date' ? 'date' : (f.type==='link' ? 'url' : 'text'));
      return '<div class="form-group"><label class="form-label" for="'+inputId+'">'+escapeHTML(f.label)+'</label><input class="form-input" id="'+inputId+'" type="'+inputType+'" name="'+f.key+'" value="'+escapeAttr(value||'')+'"></div>';
    }

    function exportFilename(scope, ext){

    function csvEscape(v){
      var s = (v===undefined||v===null) ? '' : String(v);
      if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
      return s;
    }
    function buildCSV(scope){
      var rows = [];
      if(scope==='students'){
        rows.push(['Roll','Name'].concat(state.studentSchema.map(function(f){ return f.label; })));
        state.students.forEach(function(s){ rows.push([s.roll, s.name].concat(state.studentSchema.map(function(f){ return s.fields[f.key]; }))); });
      } else if(scope==='fund'){
        rows.push(['মোট কালেকশন', totalCollected()]); rows.push(['মোট খরচ', totalExpense()]); rows.push(['ব্যালেন্স', balanceAmt()]); rows.push([]);
        rows.push(['মাস','কালেকশন','প্রত্যাশিত']);
        state.fund.months.forEach(function(m){ rows.push([monthLabel(m.key), monthCollected(m), monthExpected(m)]); });
        rows.push([]); rows.push(['তারিখ','শিরোনাম','ক্যাটেগরি','পরিমাণ']);
        state.fund.expenses.forEach(function(e){ rows.push([e.date, e.title, e.category, e.amount]); });
      } else if(state.sections[scope]){
        var sec = state.sections[scope];
        rows.push(sec.fields.map(function(f){ return f.label; }));
        sec.entries.forEach(function(en){ rows.push(sec.fields.map(function(f){ return en.values[f.key]; })); });
      } else if(scope==='all'){
        rows.push(['-- শিক্ষার্থীদের তালিকা --']);
        rows.push(['Roll','Name'].concat(state.studentSchema.map(function(f){ return f.label; })));
        state.students.forEach(function(s){ rows.push([s.roll,s.name].concat(state.studentSchema.map(function(f){ return s.fields[f.key]; }))); });
        rows.push([]); rows.push(['-- ব্যাচ ফান্ড --']); rows.push(['মাস','কালেকশন','প্রত্যাশিত']);
        state.fund.months.forEach(function(m){ rows.push([monthLabel(m.key), monthCollected(m), monthExpected(m)]); });
        rows.push([]); rows.push(['তারিখ','শিরোনাম','ক্যাটেগরি','পরিমাণ']);
        state.fund.expenses.forEach(function(e){ rows.push([e.date,e.title,e.category,e.amount]); });
        Object.keys(state.sections).forEach(function(id){
          var sec = state.sections[id];
          rows.push([]); rows.push(['-- '+sec.title+' --']);
          rows.push(sec.fields.map(function(f){ return f.label; }));
          sec.entries.forEach(function(en){ rows.push(sec.fields.map(function(f){ return en.values[f.key]; })); });
        });
      }
      return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    }
    function buildExportData(scope){
      if(scope==='students'){
        return { batch: state.meta.batchName, session: state.meta.session, students: state.students.map(function(s){
          var o = { roll:s.roll, name:s.name }; state.studentSchema.forEach(function(f){ o[f.label]=s.fields[f.key]; }); return o;
        }) };
      }
      if(scope==='fund'){
        return {
          batch: state.meta.batchName, currency: state.meta.currency,
          totalCollected: totalCollected(), totalExpense: totalExpense(), balance: balanceAmt(),
          months: state.fund.months.map(function(m){
            return { month:m.key, amount:m.amount, collected:monthCollected(m), payments: state.students.map(function(s){
              var p = getPayment(m,s.id); return { roll:s.roll, name:s.name, paid:p.paid, amount:p.amount };
            }) };
          }),
          expenses: state.fund.expenses
        };
      }
      if(scope==='all'){ return { meta: state.meta, students: state.students, fund: state.fund, sections: state.sections, exportedAt: new Date().toISOString() }; }
      if(state.sections[scope]){
        var sec = state.sections[scope];
        return { section: sec.title, entries: sec.entries.map(function(e){ var o = {}; sec.fields.forEach(function(f){ o[f.label]=e.values[f.key]; }); return o; }) };
      }
      return {};
    }

      if(scope==='fund' || scope==='all'){
        inner += '<h3>ব্যাচ ফান্ড সামারি</h3><table class="export-table"><tbody>' +
          '<tr><td>মোট কালেকশন</td><td>'+fmt(totalCollected())+'</td></tr>' +
          '<tr><td>মোট খরচ</td><td>'+fmt(totalExpense())+'</td></tr>' +
          '<tr><td>বর্তমান ব্যালেন্স</td><td>'+fmt(balanceAmt())+'</td></tr>' +
        '</tbody></table>' +
        '<h4>মাস অনুযায়ী কালেকশন</h4><table class="export-table"><thead><tr><th>মাস</th><th>কালেকশন</th><th>প্রত্যাশিত</th></tr></thead><tbody>' +
        (state.fund.months.map(function(m){ return '<tr><td>'+monthLabel(m.key)+'</td><td>'+fmt(monthCollected(m))+'</td><td>'+fmt(monthExpected(m))+'</td></tr>'; }).join('') || '<tr><td colspan="3">কোনো মাস নেই</td></tr>') +
        '</tbody></table>' +
        '<h4>খরচের তালিকা</h4><table class="export-table"><thead><tr><th>তারিখ</th><th>শিরোনাম</th><th>ক্যাটেগরি</th><th>পরিমাণ</th></tr></thead><tbody>' +
        (state.fund.expenses.map(function(e){ return '<tr><td>'+escapeHTML(e.date)+'</td><td>'+escapeHTML(e.title)+'</td><td>'+escapeHTML(e.category||'')+'</td><td>'+fmt(e.amount)+'</td></tr>'; }).join('') || '<tr><td colspan="4">কোনো খরচ নেই</td></tr>') +
        '</tbody></table>';
      }
      if(state.sections[scope]){
        var sec = state.sections[scope];
        inner += '<h3>'+escapeHTML(sec.title)+'</h3><table class="export-table"><thead><tr>'+sec.fields.map(function(f){ return '<th>'+escapeHTML(f.label)+'</th>'; }).join('')+'</tr></thead><tbody>';
        inner += sec.entries.map(function(en){ return '<tr>'+sec.fields.map(function(f){ var v=en.values[f.key]; return '<td>'+escapeHTML(v===undefined||v===null||v===''?'—':String(v))+'</td>'; }).join('')+'</tr>'; }).join('') || '<tr><td>কোনো এন্ট্রি নেই</td></tr>';
        inner += '</tbody></table>';
      }
      if(scope==='all'){
        Object.keys(state.sections).forEach(function(id){
          var sec = state.sections[id];
          inner += '<h3>'+escapeHTML(sec.title)+'</h3><table class="export-table"><thead><tr>'+sec.fields.map(function(f){ return '<th>'+escapeHTML(f.label)+'</th>'; }).join('')+'</tr></thead><tbody>';
          inner += sec.entries.map(function(en){ return '<tr>'+sec.fields.map(function(f){ var v=en.values[f.key]; return '<td>'+escapeHTML(v===undefined||v===null||v===''?'—':String(v))+'</td>'; }).join('')+'</tr>'; }).join('') || '<tr><td>কোনো এন্ট্রি নেই</td></tr>';
          inner += '</tbody></table>';
        });
      }
      wrap.innerHTML = inner;
      return wrap;
    }
    async function getDownloads(){
      if(_downloads!==undefined) return _downloads;
      try{ _downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }
      catch(err){ _downloads = null; }
      return _downloads;
    }
    function exportErrorMessage(err){
      var code = err && err.code;
      if(code==='rate_limited') return 'একটু পর আবার চেষ্টা করো';
      if(code==='too_large') return 'ফাইলটি অনেক বড় হয়ে গেছে, কম ডেটা নিয়ে আবার চেষ্টা করো';
      if(code==='rejected_extension' || code==='extension_not_enabled') return 'এই ফরম্যাটে এক্সপোর্ট করা যাচ্ছে না এই মুহূর্তে';
      if(code==='unavailable' || code==='not_granted' || code==='capability_disabled' || code==='capability_removed') return 'এই ভিউতে ফাইল সেভ করা যাচ্ছে না';
      if(code==='bad_request' || code==='transform_error') return 'এক্সপোর্ট করতে সমস্যা হয়েছে, আবার চেষ্টা করো';
      return 'এক্সপোর্ট ব্যর্থ হয়েছে, আবার চেষ্টা করো';
    }
    async function runExport(scope, format){
      closeModal();
      var downloads = await getDownloads();
      if(!downloads){ toast('এই ভিউতে ফাইল সেভ করা যাচ্ছে না'); return; }
      if((format==='pdf' || format==='png') && (typeof html2canvas==='undefined' || !window.jspdf)){
        toast('এক্সপোর্ট লাইব্রেরি লোড হয়নি — ইন্টারনেট চেক করে আবার চেষ্টা করো');
        return;
      }
      toast('এক্সপোর্ট প্রস্তুত হচ্ছে...');
      try{
        if(format==='json'){
          var data = buildExportData(scope);
          var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
          await downloads.save({ filename: exportFilename(scope,'json'), data: blob });
        } else if(format==='csv'){
          var csvText = buildCSV(scope);
          var csvBlob = new Blob(['\ufeff'+csvText], {type:'text/csv;charset=utf-8'});
          await downloads.save({ filename: exportFilename(scope,'csv'), data: csvBlob });
        } else {
          var node = buildExportSheet(scope);
          document.body.appendChild(node);
          var canvas = await html2canvas(node, {scale:2, backgroundColor:'#FCFBF7'});
          document.body.removeChild(node);
          if(format==='png'){
            var pngBlob = await new Promise(function(res){ canvas.toBlob(res, 'image/png'); });
            await downloads.save({ filename: exportFilename(scope,'png'), data: pngBlob });
          } else {
            var jsPDFCtor = window.jspdf.jsPDF;
            var pdf = new jsPDFCtor('p','pt','a4');
            var pageW = pdf.internal.pageSize.getWidth();
            var pageH = pdf.internal.pageSize.getHeight();
            var imgW = pageW;
            var imgH = canvas.height * (imgW/canvas.width);
            var heightLeft = imgH, position = 0;
            var imgData = canvas.toDataURL('image/png');
            pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
            heightLeft -= pageH;
            while(heightLeft > 0){
              position = heightLeft - imgH;
              pdf.addPage();
              pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
              heightLeft -= pageH;
            }
            var pdfBlob = pdf.output('blob');
            await downloads.save({ filename: exportFilename(scope,'pdf'), data: pdfBlob });
          }
        }
        toast('এক্সপোর্ট সম্পন্ন হয়েছে');
      } catch(err){
        if(err && err.code==='declined'){ /* user cancelled, stay silent */ }
        else { toast(exportErrorMessage(err)); }
      }
    }
    function openExportModal(scope){
      var scopeOptions = [
        {key:'students', label:'শিক্ষার্থীদের তালিকা'},
        {key:'fund', label:'ব্যাচ ফান্ড'}
      ].concat(Object.keys(state.sections).map(function(id){ return {key:id, label:state.sections[id].title}; })).concat([{key:'all', label:'সব ডেটা'}]);
      var optsHTML = scopeOptions.map(function(o){ return '<option value="'+o.key+'" '+(o.key===scope?'selected':'')+'>'+escapeHTML(o.label)+'</option>'; }).join('');
      openModal(
        '<div class="modal-header"><div class="modal-title" id="modalTitleId">এক্সপোর্ট</div><button class="modal-close" data-action="modal-close" aria-label="বন্ধ করুন">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="form-group"><label class="form-label" for="exportScopeSelect">কী এক্সপোর্ট করবে</label><select class="form-select" id="exportScopeSelect">'+optsHTML+'</select></div>' +
          '<div class="form-group"><span class="form-label" id="exportFormatLabel">ফরম্যাট</span><div class="format-choice" role="group" aria-labelledby="exportFormatLabel">' +
            '<button type="button" class="btn btn-ghost format-btn active" data-format="json">JSON</button>' +
            '<button type="button" class="btn btn-ghost format-btn" data-format="csv">CSV</button>' +
            '<button type="button" class="btn btn-ghost format-btn" data-format="pdf">PDF</button>' +
            '<button type="button" class="btn btn-ghost format-btn" data-format="png">PNG</button>' +
          '</div></div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn btn-ghost" data-action="modal-close">বাতিল</button>' +
          '<button type="button" class="btn btn-primary" id="exportConfirmBtn" data-action="export-run" data-format="json" data-scope="'+scope+'">এক্সপোর্ট করো</button>' +
        '</div>'
      );
      var scopeSel = document.getElementById('exportScopeSelect');
      var confirmBtn = document.getElementById('exportConfirmBtn');
      scopeSel.addEventListener('change', function(){ confirmBtn.dataset.scope = scopeSel.value; });
      document.querySelectorAll('.format-btn').forEach(function(b){
        b.addEventListener('click', function(){
          document.querySelectorAll('.format-btn').forEach(function(x){ x.classList.remove('active'); });
          b.classList.add('active');
          confirmBtn.dataset.format = b.dataset.format;
        });
      });
    }

    /* ================= Event delegation ================= */
    document.body.addEventListener('click', function(e){
      var t = e.target.closest('[data-action]');
      if(!t) return;
      var action = t.dataset.action;
      switch(action){
        case 'modal-stop': break;
        case 'modal-backdrop': closeModal(); break;
        case 'modal-close': closeModal(); break;
        case 'nav-switch': state.ui.activeTab = t.dataset.tab; expandedRows = new Set(); render(); break;
        case 'nav-add-section': openSectionBuilder(null); break;
        case 'open-settings': settingsTab='nav'; openSettings(); break;
        case 'settings-tab': settingsTab = t.dataset.tab; renderSettingsModal(); break;
        case 'nav-moveup': moveNav(t.dataset.id, -1); renderSettingsModal(); render(); break;
        case 'nav-movedown': moveNav(t.dataset.id, 1); renderSettingsModal(); render(); break;
        case 'nav-edit-section': openSectionBuilder(state.sections[t.dataset.id]); break;
        case 'nav-delete':
          confirmDialog('এই সেকশন ও এর সব ডেটা মুছে ফেলবে?', function(){ deleteNavItem(t.dataset.id); settingsTab='nav'; openSettings(); });
          break;
        case 'field-delete-student':
          confirmDialog('এই ফিল্ড মুছে ফেলবে?', function(){ removeStudentField(t.dataset.key); settingsTab='studentFields'; openSettings(); });
          break;
        case 'field-edit-options': {
          var f = state.studentSchema.find(function(x){ return x.key===t.dataset.key; });
          if(!f) break;
          openOptionsEditor('"'+f.label+'" এর অপশন', f.options||[], function(newOpts, renameMap){
            f.options = newOpts;
            if(renameMap){
              state.students.forEach(function(s){
                var v = s.fields[f.key];
                if(v!==undefined && Object.prototype.hasOwnProperty.call(renameMap, v)) s.fields[f.key] = renameMap[v];
              });
            }
            render(); settingsTab='studentFields'; openSettings();
          });
          break;
        }
        case 'option-add': optionsEditorList.push({id:uid(), text:'নতুন অপশন'}); renderOptionsEditorModal(); break;
        case 'option-remove': optionsEditorList.splice(Number(t.dataset.idx),1); renderOptionsEditorModal(); break;
        case 'option-moveup': {
          var i1 = Number(t.dataset.idx);
          if(i1>0){ var tmp1=optionsEditorList[i1]; optionsEditorList[i1]=optionsEditorList[i1-1]; optionsEditorList[i1-1]=tmp1; renderOptionsEditorModal(); }
          break;
        }
        case 'option-movedown': {
          var i2 = Number(t.dataset.idx);
          if(i2<optionsEditorList.length-1){ var tmp2=optionsEditorList[i2]; optionsEditorList[i2]=optionsEditorList[i2+1]; optionsEditorList[i2+1]=tmp2; renderOptionsEditorModal(); }
          break;
        }
        case 'option-save': {
          var cleaned = optionsEditorList.map(function(o){ return o.text.trim(); }).filter(Boolean);
          if(!cleaned.length) cleaned=['Option 1'];
          var renameMap = {};
          optionsEditorList.forEach(function(o){
            var oldText = optionsEditorOriginalTextById[o.id];
            if(oldText!==undefined && oldText!==o.text.trim() && o.text.trim()) renameMap[oldText]=o.text.trim();
          });
          if(optionsEditorOnSave) optionsEditorOnSave(cleaned, renameMap);
          closeModal();
          break;
        }
        case 'field-add-student': {
          var labelInp = document.getElementById('newStudentFieldLabel');
          var typeSel = document.getElementById('newStudentFieldType');
          var optsInp = document.getElementById('newStudentFieldOptions');
          var label = labelInp.value.trim();
          if(!label){ toast('ফিল্ডের নাম লেখো'); break; }
          var options = typeSel.value==='select' ? optsInp.value.split(',').map(function(x){return x.trim();}).filter(Boolean) : undefined;
          if(typeSel.value==='select' && (!options || !options.length)) options=['Option 1'];
          addStudentField({ key: slugify(label), label: label, type: typeSel.value, options: options });
          settingsTab='studentFields'; openSettings();
          break;
        }
        case 'data-reset': confirmDialog('সব ডেটা মুছে রিসেট করবে? এটি ফিরিয়ে আনা যাবে না।', function(){ resetAllData(); closeModal(); }); break;
        case 'student-add': openStudentForm(null); break;
        case 'student-edit': openStudentForm(state.students.find(function(s){ return s.id===t.dataset.id; })); break;
        case 'student-delete': deleteStudentSoft(t.dataset.id); break;
        case 'row-toggle':
          if(expandedRows.has(t.dataset.id)) expandedRows.delete(t.dataset.id); else expandedRows.add(t.dataset.id);
          render();
          break;
        case 'home-filter': homeFilter = t.dataset.filter; render(); break;
        case 'open-export': openExportModal(t.dataset.scope); break;
        case 'export-run': runExport(t.dataset.scope, t.dataset.format); break;
        case 'fund-add-month': addMonth(); break;
        case 'month-toggle': expandedMonth = (expandedMonth===t.dataset.key) ? null : t.dataset.key; render(); break;
        case 'month-delete': confirmDialog('এই মাসের সব ডেটা মুছে ফেলবে?', function(){ deleteMonth(t.dataset.month); }); break;
        case 'month-markall': markAllPaid(t.dataset.month); break;
        case 'expense-add': openExpenseForm(null); break;
        case 'expense-edit': openExpenseForm(state.fund.expenses.find(function(x){ return x.id===t.dataset.id; })); break;
        case 'expense-delete': deleteExpenseSoft(t.dataset.id); break;
        case 'section-entry-add': openSectionEntryForm(t.dataset.section, null); break;
        case 'section-entry-edit': openSectionEntryForm(t.dataset.section, state.sections[t.dataset.section].entries.find(function(x){ return x.id===t.dataset.id; })); break;
        case 'section-entry-delete': deleteSectionEntrySoft(t.dataset.section, t.dataset.id); break;
        case 'builder-add-field': builderFields.push({key:null, label:'', type:'text'}); renderSectionBuilderModal(); break;
        case 'builder-remove-field': builderFields.splice(Number(t.dataset.idx), 1); renderSectionBuilderModal(); break;
        case 'confirm-yes': { var cb = pendingConfirm; pendingConfirm=null; closeModal(); if(cb) cb(); break; }
        case 'confirm-no': pendingConfirm=null; closeModal(); break;
        case 'toast-undo': {
          if(toastUndoCb){ var ucb=toastUndoCb; toastUndoCb=null; ucb(); }
          document.getElementById('toastContainer').classList.remove('show');
          break;
        }
        case 'theme-toggle': {
          var order = ['auto','light','dark'];
          var tidx = order.indexOf((state.ui.theme||'auto'));
          state.ui.theme = order[(tidx+1)%order.length];
          applyTheme();
          render();
          break;
        }
        case 'dismiss-onboarding': state.ui.onboarded = true; render(); break;
        case 'due-remind': {
          var rs = state.students.find(function(x){ return x.id===t.dataset.id; });
          if(rs) openReminderModal(rs, studentDue(rs.id));
          break;
        }
        case 'reminder-copy': {
          var ta2 = document.getElementById('reminderText');
          var statusEl = document.getElementById('reminderCopyStatus');
          if(ta2){
            ta2.focus(); ta2.select();
            var reportOk = function(){ if(statusEl) statusEl.textContent='কপি হয়েছে ✓'; };
            var reportManual = function(){ if(statusEl) statusEl.textContent='মেসেজ সিলেক্ট করা আছে — এখন Ctrl/Cmd+C চাপো'; };
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(ta2.value).then(reportOk).catch(function(){
                try{ if(document.execCommand('copy')) reportOk(); else reportManual(); }catch(e){ reportManual(); }
              });
            } else {
              try{ if(document.execCommand('copy')) reportOk(); else reportManual(); }catch(e){ reportManual(); }
            }
          }
          break;
        }
      }
    });
    document.body.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' ' || e.key==='Spacebar'){
        var t = e.target;
        if(t && t.getAttribute && t.getAttribute('role')==='button' && t.dataset && t.dataset.action){
          e.preventDefault();
          t.click();
        }
      }
    });
    document.body.addEventListener('input', function(e){
      var t = e.target;
      if(!t.dataset || !t.dataset.action) return;
      switch(t.dataset.action){
        case 'home-search': homeSearch = t.value; render(); break;
        case 'payment-amount': setPaymentAmount(t.dataset.month, t.dataset.student, t.value); render(); break;
        case 'month-amount': setMonthAmount(t.dataset.month, t.value); render(); break;
      }
    });
    document.body.addEventListener('change', function(e){
      var t = e.target;
      if(t.dataset && t.dataset.settingsField){
        var key = t.dataset.settingsField;
        if(key==='batchName') state.meta.batchName = t.value;
        else if(key==='session') state.meta.session = t.value;
        else if(key==='currency') state.meta.currency = t.value || '৳';
        else if(key==='monthlyAmount') state.fund.monthlyAmount = Number(t.value||0);
        render();
        return;
      }
      if(!t.dataset || !t.dataset.action) return;
      switch(t.dataset.action){
        case 'payment-toggle': togglePayment(t.dataset.month, t.dataset.student, t.checked); render(); break;
        case 'nav-relabel': renameNav(t.dataset.id, t.value); break;
        case 'home-sort': homeSort = t.value; render(); break;
      }
    });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

    /* ================= Init ================= */
    document.addEventListener('DOMContentLoaded', function(){
      state = migrateState(loadState());
      applyTheme();
      if(!state.nav.some(function(n){ return n.id===state.ui.activeTab; })) state.ui.activeTab='home';
      if(state.fund.months.length){
        expandedMonth = state.fund.months.slice().sort(function(a,b){ return b.key.localeCompare(a.key); })[0].key;
      }
      render();
      getDownloads();
    });
  })();
  </script>
